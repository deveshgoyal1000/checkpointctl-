syntax = "proto2";

package criu;

message ipc_var_entry {
    required uint32 sem_ctls_max = 1;
    required uint32 msg_ctlmax = 2;
    required uint32 msg_max = 3;
    required uint32 msg_mnb = 4;
    required uint32 auto_msgmni = 5;
    required uint32 shmmax = 6;
    required uint32 shmall = 7;
    required uint32 shmmni = 8;
    required uint32 shm_ctls_max = 9;
    required uint32 shm_rmid_forced = 10;
    required uint32 mq_queues_max = 11;
    required uint32 mq_msg_max = 12;
    required uint32 mq_msgsize_max = 13;
    required uint32 mq_msg_default = 14;
    required uint32 mq_msgsize_default = 15;
}

message ipc_shm_entry {
    required uint32 key = 1;
    required uint32 uid = 2;
    required uint32 gid = 3;
    required uint32 mode = 4;
    required uint64 size = 5;
    required uint64 shmid = 6;
}

message ipc_msg_entry {
    required uint32 qbytes = 1;
    required uint32 qnum = 2;
    required uint32 msgid = 3;
}

message ipc_sem_entry {
    required uint32 semid = 1;
    required uint32 nsems = 2;
    repeated uint32 vals = 3;
}

message ipc_msg_queue_entry {
    required uint32 key = 1;
    required uint32 uid = 2;
    required uint32 gid = 3;
    required uint32 mode = 4;
    required ipc_msg_entry msg = 5;
}

message ipc_namespace_entry {
    repeated ipc_shm_entry shm_entries = 1;
    repeated ipc_msg_queue_entry msg_queue_entries = 2;
    repeated ipc_sem_entry sem_entries = 3;
    optional ipc_var_entry var_entry = 4;
}
